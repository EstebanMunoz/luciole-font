name: Create release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+**"

permissions:
  contents: write

jobs:
  release:
    name: Release tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Zip sources
        run: |
          git archive --format zip ${{ github.ref_name }} \
          src LICENSE-CC-BY-4.0.txt LICENSE-OFL.txt \
          --output luciole-${{ github.ref_name }}.zip

      - name: Inspect archive
        run: |
          ls -lh luciole-${{ github.ref_name }}.zip
          unzip -l luciole-${{ github.ref_name }}.zip
